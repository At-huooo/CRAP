<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C.R.A.P. — Cycloid Ramp Accurate Prediction</title>
  <meta name="description" content="Predict the flight of a ball launched from a cycloid ramp, or find the drop height that lands it on a target.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Short+Stack&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Sets light/dark before the page draws (plain script, runs immediately) -->
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- ============ Top bar ============ -->
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand__mark" role="img" aria-label="C.R.A.P."></span>
      <span class="brand__name">Cycloid ramp<br>accurate prediction</span>
    </a>

    <nav class="segmented" role="tablist" aria-label="Mode">
      <button class="segmented__tab" role="tab" id="tab-trajectory"
              aria-controls="mode-trajectory" data-mode="trajectory">
        Trajectory
      </button>
      <button class="segmented__tab" role="tab" id="tab-drop-height"
              aria-controls="mode-drop-height" data-mode="drop-height">
        Drop height
      </button>
    </nav>

    <div class="topbar__actions">
      <button class="chip server-status" id="server-status" type="button" data-state="checking">
        <span class="server-status__dot" aria-hidden="true"></span>
        <span class="server-status__label">Checking server…</span>
      </button>
      <button class="icon-button" id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ Workspace ============ -->
  <main class="workspace">
    <!-- Left: the form for the active mode -->
    <aside class="panel" aria-label="Inputs">
      <section class="mode" id="mode-trajectory" role="tabpanel" aria-labelledby="tab-trajectory">
        <form class="mode__form" id="trajectory-form" novalidate>
          <div class="form-groups" data-groups></div>
          <div class="form-actions">
            <button class="button button--primary button--block" type="submit">Run simulation</button>
          </div>
        </form>
      </section>

      <section class="mode" id="mode-drop-height" role="tabpanel" aria-labelledby="tab-drop-height" hidden>
        <form class="mode__form" id="drop-height-form" novalidate>
          <div class="form-groups" data-groups></div>
          <div class="form-actions">
            <button class="button button--primary button--block" type="submit">Find drop height</button>
          </div>
        </form>
      </section>
    </aside>

    <!-- Right: plot and results -->
    <section class="stage" aria-label="Results">
      <div class="card plot-card">
        <div class="card__head">
          <h2 class="card__title" id="plot-title">Flight path</h2>
          <div class="card__controls">
            <label class="switch">
              <input type="checkbox" id="true-scale" checked>
              <span class="switch__track" aria-hidden="true"></span>
              <span>True scale</span>
            </label>
          </div>
        </div>

        <div class="plot" id="plot">
          <canvas class="plot__canvas" aria-label="Plot of the ball's flight path" role="img"></canvas>
          <p class="plot__empty" id="plot-empty"></p>
          <div class="plot__tooltip" id="plot-tooltip" hidden></div>
        </div>

        <!-- Playback: play the flight or scrub through it -->
        <div class="playback" id="playback">
          <button class="icon-button icon-button--solid" type="button" id="replay" aria-label="Play flight" disabled>
            <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg>
            <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 4.5h3v11h-3zM11.5 4.5h3v11h-3z" fill="currentColor"/></svg>
          </button>
          <div class="scrubber-wrap">
            <span class="scrubber__fill" aria-hidden="true"></span>
            <input class="scrubber" type="range" id="scrubber" min="0" max="1000" value="1000" step="1"
                   aria-label="Time in flight" disabled>
          </div>
          <dl class="readout" id="readout">
            <div><dt>t</dt><dd data-readout="t">–</dd></div>
            <div><dt>x</dt><dd data-readout="x">–</dd></div>
            <div><dt>y</dt><dd data-readout="y">–</dd></div>
            <div><dt>|v|</dt><dd data-readout="v">–</dd></div>
          </dl>
        </div>

        <ul class="plot-legend" id="plot-legend" hidden>
          <li><span class="swatch swatch--path"></span>This run</li>
          <li data-legend="ghost"><span class="swatch swatch--ghost"></span>Previous run</li>
          <li data-legend="target"><span class="swatch swatch--target"></span>Target</li>
          <li><span class="swatch swatch--vector"></span>Velocity (hover)</li>
        </ul>
      </div>

      <div class="results" id="results" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <span>For TPC 26–27</span>
    <span>Made by Phuong | Duc | Lucia | Von | Maria</span>
  </footer>

  <!-- ============ Server settings dialog ============ -->
  <dialog class="dialog" id="server-dialog" aria-labelledby="server-dialog-title">
    <form method="dialog" class="dialog__body" id="server-form">
      <h2 id="server-dialog-title">Server</h2>
      <p class="dialog__text">
        Calculations run on the backend. Use your local server or the deployed one.
      </p>
      <label class="field">
        <span class="field__label">Server address</span>
        <span class="field__control">
          <input class="field__input" type="url" id="server-url" required spellcheck="false"
                 placeholder="http://localhost:8000">
        </span>
      </label>
      <p class="dialog__status" id="server-dialog-status"></p>
      <div class="dialog__actions">
        <button class="button button--ghost" type="button" id="server-reset">Use default</button>
        <button class="button" value="cancel" formnovalidate>Cancel</button>
        <button class="button button--primary" type="submit" value="save">Save and check</button>
      </div>
    </form>
  </dialog>
</body>
</html>
